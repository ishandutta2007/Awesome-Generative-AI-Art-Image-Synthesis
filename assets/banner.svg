<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="40%" stop-color="#120a2e" />
      <stop offset="80%" stop-color="#1b0836" />
      <stop offset="100%" stop-color="#070214" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filters for Glow -->
    <filter id="glow-strong" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.45; }
      50% { transform: scale(1.25) translate(40px, -20px); opacity: 0.75; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-18px) rotate(180deg); }
    }
    @keyframes wavePath {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 600; }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .orb1 { animation: pulseOrb 10s ease-in-out infinite; transform-origin: 200px 100px; }
    .orb2 { animation: pulseOrb 12s ease-in-out infinite reverse; transform-origin: 1000px 300px; }
    .float1 { animation: floatParticle 8s ease-in-out infinite; }
    .float2 { animation: floatParticle 11s ease-in-out infinite 2s; }
    .wave { stroke-dasharray: 20 10; animation: wavePath 25s linear infinite; }
    .pill-group-1 { animation: pillFloat1 5s ease-in-out infinite; }
    .pill-group-2 { animation: pillFloat2 6s ease-in-out infinite 1s; }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 46px;
      font-weight: 800;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
      fill: #cbd5e1;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      fill: #e2e8f0;
      letter-spacing: 0.5px;
    }
    .badge-icon {
      font-size: 14px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Background Orbs (Placed strictly in deep background) -->
  <g opacity="0.6">
    <circle class="orb1" cx="220" cy="120" r="160" fill="#a855f7" filter="url(#glow-strong)" />
    <circle class="orb2" cx="980" cy="280" r="180" fill="#ec4899" filter="url(#glow-strong)" />
    <circle cx="600" cy="380" r="140" fill="#3b82f6" filter="url(#glow-strong)" opacity="0.3" />
  </g>

  <!-- Dynamic Flowing Wave Lines in Midground (Behind text) -->
  <g opacity="0.25">
    <path class="wave" d="M -50 300 Q 300 200 600 280 T 1250 220" fill="none" stroke="url(#primary-grad)" stroke-width="2.5" />
    <path class="wave" d="M -50 340 Q 350 250 650 310 T 1250 260" fill="none" stroke="url(#cyan-glow)" stroke-width="1.5" />
  </g>

  <!-- Geometric Decorative Elements -->
  <g class="float1" opacity="0.4">
    <rect x="140" y="70" width="18" height="18" rx="4" fill="#f43f5e" transform="rotate(25 140 70)" />
    <polygon points="1060,90 1075,115 1045,115" fill="#a855f7" />
  </g>
  <g class="float2" opacity="0.4">
    <circle cx="1090" cy="210" r="8" fill="#38bdf8" />
    <rect x="110" y="310" width="14" height="14" rx="3" fill="#fbbf24" transform="rotate(45 110 310)" />
  </g>

  <!-- Main Foreground Content (Clear & High Contrast) -->
  <!-- Top Category Chip -->
  <g transform="translate(430, 52)">
    <rect width="340" height="34" rx="17" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4" />
    <text x="170" y="22" text-anchor="middle" class="tag-text" fill="#d8b4fe">✨ CURATED REPOSITORY &amp; INDEX</text>
  </g>

  <!-- Title & Gradient Text -->
  <g transform="translate(600, 142)">
    <text text-anchor="middle" class="title-text">
      🎨 Generative AI Art &amp; Image Synthesis
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 185)">
    <text text-anchor="middle" class="subtitle-text">
      The definitive directory of frontier text-to-image foundation models, node GUIs &amp; creative pipelines
    </text>
  </g>

  <!-- Dynamic Feature Badges / Pills (Animated floating gently at the bottom, foreground safe) -->
  <g class="pill-group-1" transform="translate(0, 0)">
    <!-- Pill 1: FLUX & SD 3.5 -->
    <g transform="translate(180, 240)">
      <rect width="185" height="42" rx="21" fill="url(#card-grad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow-subtle)" />
      <text x="92" y="26" text-anchor="middle" class="tag-text">⚡ FLUX.1 &amp; SD 3.5</text>
    </g>

    <!-- Pill 2: ComfyUI & Forge -->
    <g transform="translate(390, 240)">
      <rect width="195" height="42" rx="21" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow-subtle)" />
      <text x="97" y="26" text-anchor="middle" class="tag-text">🎛️ ComfyUI &amp; Forge GUIs</text>
    </g>

    <!-- Pill 3: ControlNet & LoRA -->
    <g transform="translate(610, 240)">
      <rect width="200" height="42" rx="21" fill="url(#card-grad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow-subtle)" />
      <text x="100" y="26" text-anchor="middle" class="tag-text">🎯 ControlNet &amp; LoRAs</text>
    </g>

    <!-- Pill 4: Open Weights -->
    <g transform="translate(835, 240)">
      <rect width="185" height="42" rx="21" fill="url(#card-grad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow-subtle)" />
      <text x="92" y="26" text-anchor="middle" class="tag-text">🚀 Open-Source Local</text>
    </g>
  </g>

  <!-- Secondary Metadata Line -->
  <g class="pill-group-2" transform="translate(600, 335)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="0.8px">
      PROMPT-TO-IMAGE • FLOW-MATCHING • INPAINTING • MULTIMODAL EDITING • VECTOR DESIGN
    </text>
  </g>
</svg>
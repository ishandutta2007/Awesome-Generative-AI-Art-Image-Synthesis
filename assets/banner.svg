<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a051b"/><stop offset="40%" stop-color="#120a2e"/><stop offset="80%" stop-color="#1b0836"/><stop offset="100%" stop-color="#070214"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#f36"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#3b82f6"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#4facfe" stop-opacity=".2"/></linearGradient><linearGradient id="card-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow-strong" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="24"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glow-subtle" width="120%" height="120%" x="-10%" y="-10%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".05" stroke-width=".5" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulseOrb{0%{transform:scale(1) translate(0,0);opacity:.45}50%{transform:scale(1.25) translate(40px,-20px);opacity:.75}}@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-18px) rotate(180deg)}}@keyframes wavePath{0%{stroke-dashoffset:0}}@keyframes pillFloat1{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pillFloat2{0%{transform:translateY(0)}50%{transform:translateY(6px)}}.orb1{animation:pulseOrb 10s ease-in-out infinite;transform-origin:200px 100px}.orb2{animation:pulseOrb 12s ease-in-out infinite reverse;transform-origin:1000px 300px}.float1{animation:floatParticle 8s ease-in-out infinite}.float2{animation:floatParticle 11s ease-in-out infinite 2s}.wave{stroke-dasharray:20 10;animation:wavePath 25s linear infinite}.pill-group-1{animation:pillFloat1 5s ease-in-out infinite}.pill-group-2{animation:pillFloat2 6s ease-in-out infinite 1s}.subtitle-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-size:46px;font-weight:800;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-size:20px;font-weight:400;fill:#cbd5e1;letter-spacing:.2px}.tag-text{font-size:13px;font-weight:600;fill:#e2e8f0;letter-spacing:.5px}</style><rect width="1200" height="400" fill="url(#bg-grad)" rx="16"/><rect width="1200" height="400" fill="url(#grid)" rx="16"/><g opacity=".6"><circle cx="220" cy="120" r="160" fill="#a855f7" class="orb1" filter="url(#glow-strong)"/><circle cx="980" cy="280" r="180" fill="#ec4899" class="orb2" filter="url(#glow-strong)"/><circle cx="600" cy="380" r="140" fill="#3b82f6" filter="url(#glow-strong)" opacity=".3"/></g><g opacity=".25"><path fill="none" stroke="url(#primary-grad)" stroke-width="2.5" d="M -50 300 Q 300 200 600 280 T 1250 220" class="wave"/><path fill="none" stroke="url(#cyan-glow)" stroke-width="1.5" d="M -50 340 Q 350 250 650 310 T 1250 260" class="wave"/></g><g class="float1" opacity=".4"><rect width="18" height="18" x="140" y="70" fill="#f43f5e" rx="4" transform="rotate(25 140 70)"/><polygon fill="#a855f7" points="1060 90 1075 115 1045 115"/></g><g class="float2" opacity=".4"><circle cx="1090" cy="210" r="8" fill="#38bdf8"/><rect width="14" height="14" x="110" y="310" fill="#fbbf24" rx="3" transform="rotate(45 110 310)"/></g><g transform="translate(430, 52)"><rect width="340" height="34" fill="url(#card-grad)" stroke="#a855f7" stroke-opacity=".4" stroke-width="1" rx="17"/><text x="170" y="22" fill="#d8b4fe" class="tag-text" text-anchor="middle">✨ CURATED REPOSITORY &amp; INDEX</text></g><g><text class="title-text" text-anchor="middle" transform="translate(600, 142)">🎨 Generative AI Art &amp; Image Synthesis</text></g><g><text class="subtitle-text" text-anchor="middle" transform="translate(600, 185)">The definitive directory of frontier text-to-image foundation models, node GUIs &amp; creative pipelines</text></g><g class="pill-group-1"><g transform="translate(0, 0) translate(180, 240)"><rect width="185" height="42" fill="url(#card-grad)" stroke="#a855f7" stroke-opacity=".6" stroke-width="1.2" filter="url(#glow-subtle)" rx="21"/><text x="92" y="26" class="tag-text" text-anchor="middle">⚡ FLUX.1 &amp; SD 3.5</text></g><g transform="translate(0, 0) translate(390, 240)"><rect width="195" height="42" fill="url(#card-grad)" stroke="#3b82f6" stroke-opacity=".6" stroke-width="1.2" filter="url(#glow-subtle)" rx="21"/><text x="97" y="26" class="tag-text" text-anchor="middle">🎛️ ComfyUI &amp; Forge GUIs</text></g><g transform="translate(0, 0) translate(610, 240)"><rect width="200" height="42" fill="url(#card-grad)" stroke="#ec4899" stroke-opacity=".6" stroke-width="1.2" filter="url(#glow-subtle)" rx="21"/><text x="100" y="26" class="tag-text" text-anchor="middle">🎯 ControlNet &amp; LoRAs</text></g><g transform="translate(0, 0) translate(835, 240)"><rect width="185" height="42" fill="url(#card-grad)" stroke="#10b981" stroke-opacity=".6" stroke-width="1.2" filter="url(#glow-subtle)" rx="21"/><text x="92" y="26" class="tag-text" text-anchor="middle">🚀 Open-Source Local</text></g></g><g class="pill-group-2"><text fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" letter-spacing=".8" text-anchor="middle" transform="translate(600, 335)">PROMPT-TO-IMAGE • FLOW-MATCHING • INPAINTING • MULTIMODAL EDITING • VECTOR DESIGN</text></g></svg>